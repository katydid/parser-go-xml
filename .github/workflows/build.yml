name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: gopath/katydid.org.za/go/parser-go-xml
    - name: Setup Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24
    - name: Fetch dependencies
      run: |
        cd gopath/katydid.org.za/go/parser-go-xml
        go mod download -x
    - name: env
      run: env && go env && pwd
    - name: tree
      run: tree
    - name: Build
      run: |
        cd gopath/katydid.org.za/go/parser-go-xml
        make build
    - name: Test
      run: |
        cd gopath/katydid.org.za/go/parser-go-xml
        make test
    - name: Checklicense
      uses: awalterschulze/checklicense@v1.0.6
      with:
        path: .
        ignores: doc.go .svg .txt .drawio
    - name: Diff
      run: |
        cd gopath/katydid.org.za/go/parser-go-xml
        make diff
